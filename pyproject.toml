[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-optimizer"
version = "0.3.0"
description = "Industrial energy analytics, meter-data validation, and cost-aware load scheduling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Energy Optimizer contributors" }]
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.50", "openpyxl>=3.1"]
optimization = ["scipy>=1.11"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["I001"]
